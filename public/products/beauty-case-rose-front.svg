      <stop offset="0" stop-color="#f7f1ea"/>
      <stop offset="1" stop-color="#efe5d8"/>
    </linearGradient>
    <linearGradient id="caseRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c9c4"/>
      <stop offset="1" stop-color="#d49b96"/>
    </linearGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="rgba(31,29,28,0.25)"/>
      <stop offset="1" stop-color="rgba(31,29,28,0)"/>
